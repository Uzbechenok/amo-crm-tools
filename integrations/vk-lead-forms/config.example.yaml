# Конфигурация интеграции VK Lead Forms → amoCRM
# Скопируйте в config.yaml и заполните своими данными

vk:
  # OAuth2 данные VK Ads API (ads.vk.com)
  # Получить: ads.vk.com → Настройки → API Access
  client_id: "your_vk_client_id"
  # client_secret показывается один раз на 10 минут — скопировать сразу
  client_secret: "your_vk_client_secret"

  # ID рекламного кабинета VK (числовой)
  ad_account_id: 123456789

  # ID конкретной лид-формы (если не указан — обрабатываются все формы кабинета)
  # lead_form_id: 12345

amocrm:
  # OAuth2 данные приложения amoCRM
  # Получить: https://www.amocrm.ru/ → Настройки → API → Создать интеграцию
  client_id: "your_amocrm_client_id"
  client_secret: "your_amocrm_client_secret"
  redirect_uri: "https://your-domain.com/oauth/callback"

  # Поддомен amoCRM (без .amocrm.ru)
  subdomain: "your-subdomain"

mapping:
  # Маппинг полей VK → amoCRM
  # vk: строка поиска в ответах анкеты
  # amocrm: одно из:
  #   - "name"        — стандартное поле "Имя"
  #   - "phone"       — стандартное поле "Телефон"
  #   - "email"       — стандартное поле "Email"
  #   - "custom_XXXX"         — кастомное поле контакта (CF ID)
  #   - "contact_custom_XXXX" — кастомное поле контакта (CF ID, явный префикс)
  #   - "lead_custom_XXXX"    — кастомное поле сделки (CF ID)
  fields:
    - vk: "Имя"
      amocrm: "name"          # Стандартное поле "Имя"
    - vk: "Телефон"
      amocrm: "phone"         # Стандартное поле "Телефон"
    - vk: "Email"
      amocrm: "email"         # Стандартное поле "Email"
    - vk: "Комментарий"
      amocrm: "contact_custom_12345"  # Кастомное поле контакта
    - vk: "Город"
      amocrm: "lead_custom_12346"     # Кастомное поле сделки

pipeline:
  # ID воронки (по умолчанию 1 — Первая)
  id: 1

  # ID статуса сделки (по умолчанию 14351486 — Первичный контакт)
  status_id: 14351486

  # ID ответственного пользователя
  responsible_user_id: 123456

polling:
  # Интервал опроса в минутах
  interval_minutes: 5

logging:
  # Уровень логирования: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Путь к файлу лога (если не указан — только stdout)
  # file: /var/log/vk-lead-forms.log
